<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <meta name="color-scheme" content="dark" />
  <title>@zen</title>
  <meta name="description" content="zen — music, favourites and more at zensobased.lol." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="zensobased.lol" />
  <meta property="og:title" content="zen" />
  <meta property="og:description" content="music, favourites and more at zensobased.lol." />
  <meta property="og:url" content="https://zensobased.lol/" />
  <meta property="og:image" content="https://site-da7f266cd38645a88d82577d4531a2db.freebuff.page/api/og.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="zen — music, favourites and more at zensobased.lol" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="zen" />
  <meta name="twitter:description" content="music, favourites and more at zensobased.lol." />
  <meta name="twitter:image" content="https://site-da7f266cd38645a88d82577d4531a2db.freebuff.page/api/og.png" />
  <link rel="icon" id="favicon" href="assets/pfp.png" />
  <link rel="preload" href="assets/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css?v=11" />
</head>
<body>
  <!-- background -->
  <div class="bg-image" aria-hidden="true"></div>
  <div class="bg-shade" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- click to enter -->
  <div class="loader" id="loader" role="button" tabindex="0" aria-label="Click to enter">
    <span class="caret" aria-hidden="true"></span>
    <p class="enter-hint">click to enter</p>
  </div>

  <!-- audio toggle -->
  <button class="audio-btn" id="audioBtn" type="button" aria-label="Play profile song" aria-pressed="false">
    <svg class="icon icon-volume" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <mask id="volumeMask">
          <g fill="none" stroke="#fff" stroke-width="4">
            <path fill="#555" stroke-linejoin="round" d="M24 6v36c-7 0-12.201-9.16-12.201-9.16H6a2 2 0 0 1-2-2V17.01a2 2 0 0 1 2-2h5.799S17 6 24 6Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M32 15a11.91 11.91 0 0 1 1.684 1.859A12.07 12.07 0 0 1 36 24c0 2.654-.846 5.107-2.278 7.09A11.936 11.936 0 0 1 32 33" />
            <path stroke-linecap="round" d="M34.236 41.186C40.084 37.696 44 31.305 44 24c0-7.192-3.796-13.496-9.493-17.02" />
          </g>
        </mask>
      </defs>
      <path fill="currentColor" d="M0 0h48v48H0z" mask="url(#volumeMask)" />
    </svg>
    <svg class="icon icon-pause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="6" y="5" width="4" height="14" rx="1.4" fill="currentColor" />
      <rect x="14" y="5" width="4" height="14" rx="1.4" fill="currentColor" />
    </svg>
    <audio id="song" src="assets/raininglol.mp3" loop preload="auto"></audio>
  </button>

  <!-- profile -->
  <main class="profile">
    <div class="tilt-box" id="tiltBox">
      <div class="card">
        <div class="avatar-wrap reveal" data-delay="0">
          <img class="avatar" id="avatar" src="assets/pfp.png" alt="zen avatar" />
        </div>

        <div class="info">
          <div class="name-row reveal" data-delay="1">
            <h1 class="name">zen</h1>
            <div class="badges" aria-label="Badges">
              <span class="badge" title="Premium">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="23 32 465 448" aria-hidden="true">
                  <path fill="currentColor" d="M396.31 32H264l84.19 112.26L396.31 32zm-280.62 0l48.12 112.26L248 32H115.69zM256 74.67L192 160h128l-64-85.33zm166.95-23.61L376.26 160H488L422.95 51.06zm-333.9 0L23 160h112.74L89.05 51.06zM146.68 192H24l222.8 288h.53L146.68 192zm218.64 0L264.67 480h.53L488 192H365.32zm-35.93 0H182.61L256 400l73.39-208z" />
                </svg>
              </span>
            </div>
          </div>

          <p class="bio reveal" data-delay="2" id="bio">yooo wsp</p>

          <div class="status-row reveal" data-delay="3">
            <span class="handle" id="handle">@rebornzen</span>

            <div class="discord" id="discord" data-status="loading" title="Discord status">
              <svg class="icon-discord" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.196.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" />
              </svg>
              <span class="discord-dot" aria-hidden="true"></span>
              <span class="discord-label" id="discordLabel">discord</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- footer stats -->
  <footer class="meta reveal" data-delay="3">
    <span class="stat views">
      <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 9a3 3 0 0 0-3 3a3 3 0 0 0 3 3a3 3 0 0 0 3-3a3 3 0 0 0-3-3m0 8a5 5 0 0 1-5-5a5 5 0 0 1 5-5a5 5 0 0 1 5 5a5 5 0 0 1-5 5m0-12.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5" />
      </svg>
      <span class="count" id="views" aria-label="Profile views">1,042</span>
    </span>
    <span class="sep" aria-hidden="true">|</span>
    <span class="stat location">
      <svg class="icon-pin" xmlns="http://www.w3.org/2000/svg" viewBox="4 2 16 20" aria-hidden="true">
        <path fill="currentColor" d="M12 12q.825 0 1.413-.587T14 10t-.587-1.412T12 8t-1.412.588T10 10t.588 1.413T12 12m0 10q-4.025-3.425-6.012-6.362T4 10.2q0-3.75 2.413-5.975T12 2t5.588 2.225T20 10.2q0 2.5-1.987 5.438T12 22" />
      </svg>
      <span id="location">Tokyo, Japan</span>
    </span>
  </footer>

  <!-- hidden admin: alt + y -->
  <div class="admin" id="admin" hidden>
    <form class="admin-panel" id="adminForm" autocomplete="off">
      <p class="admin-title">admin</p>

      <label class="admin-field" id="adminKeyField">
        <span>key</span>
        <input type="password" id="adminKey" placeholder="enter key" />
      </label>

      <label class="admin-field" id="adminHandleField" hidden>
        <span>handle</span>
        <input type="text" id="adminHandle" maxlength="32" />
      </label>

      <label class="admin-field" id="adminBioField" hidden>
        <span>bio</span>
        <input type="text" id="adminBio" maxlength="80" />
      </label>

      <label class="admin-field" id="adminLocationField" hidden>
        <span>location</span>
        <input type="text" id="adminLocation" maxlength="40" />
      </label>

      <label class="admin-field" id="adminLastfmField" hidden>
        <span>last.fm</span>
        <input type="text" id="adminLastfm" maxlength="40" placeholder="username" autocapitalize="off" spellcheck="false" />
      </label>

      <label class="admin-field" id="adminSongField" hidden>
        <span>song</span>
        <select id="adminSong">
          <option value="">raininglol</option>
        </select>
      </label>

      <label class="admin-field" id="adminSongUploadField" hidden>
        <span>upload a song</span>
        <input type="file" id="adminSongFile" accept="audio/mpeg,audio/mp4,audio/x-m4a,audio/aac,audio/ogg,audio/wav,audio/webm,audio/flac" />
      </label>

      <label class="admin-field" id="adminBackgroundField" hidden>
        <span>background</span>
        <select id="adminBackground">
          <option value="">default</option>
        </select>
      </label>

      <label class="admin-field" id="adminBackgroundUploadField" hidden>
        <span>upload image / video · 30mb</span>
        <input type="file" id="adminBackgroundFile" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,video/mp4,video/webm,video/quicktime,video/x-m4v" />
      </label>

      <label class="admin-field" id="adminViewsField" hidden>
        <span>views</span>
        <input type="number" id="adminViews" min="0" step="1" inputmode="numeric" />
      </label>

      <button class="admin-submit" type="submit">enter</button>

      <button class="admin-submit admin-reset" type="button" id="adminReset" hidden>reset</button>

      <p class="admin-hint" id="adminHint">alt + y to close</p>
    </form>
  </div>

  <!-- other pages -->
  <div class="page-actions">
    <a class="page-btn" href="favourites.html" aria-label="Open the favourites page" title="favourites">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 2.6l2.87 5.82 6.42.93-4.64 4.53 1.09 6.4L12 17.25l-5.74 3.03 1.09-6.4L2.71 9.35l6.42-.93z" />
      </svg>
    </a>
    <a class="page-btn" href="music.html" aria-label="Open the music page" title="music">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" />
      </svg>
    </a>
  </div>

  <script src="background.js?v=1"></script>
  <script src="script.js?v=10"></script>
</body>
</html>
