<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hi</title>

  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
    }

    #hi {
      font-size: 48px;
      text-shadow:
        0 0 8px rgba(255, 255, 255, 0.7),
        0 0 18px rgba(255, 255, 255, 0.35);
    }

    #oft {
      margin-top: 8px;
      font-size: 24px;
      text-shadow:
        0 0 6px rgba(255, 255, 255, 0.6),
        0 0 14px rgba(255, 255, 255, 0.3);
    }

    @media (max-width: 600px) {
      #hi {
        font-size: 32px;
      }

      #oft {
        font-size: 18px;
      }
    }
  </style>

</head>

<body>
  <div class="container">
    <div id="hi">Hi</div>
    <div id="oft">/oft</div>
  </div>
</body>
</html>
