<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@zen</title>
  <meta name="description" content="yooo wsp" />
  <link rel="icon" href="assets/pfp.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- background -->
  <div class="bg-image" aria-hidden="true"></div>
  <div class="bg-shade" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- click to enter -->
  <div class="loader" id="loader" role="button" tabindex="0" aria-label="Click to enter">
    <span class="caret" aria-hidden="true"></span>
    <p class="enter-hint">click to enter</p>
  </div>

  <!-- audio toggle -->
  <button class="audio-btn" id="audioBtn" type="button" aria-label="Play profile song" aria-pressed="false">
    <svg class="icon icon-volume" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <mask id="volumeMask">
          <g fill="none" stroke="#fff" stroke-width="4">
            <path fill="#555" stroke-linejoin="round" d="M24 6v36c-7 0-12.201-9.16-12.201-9.16H6a2 2 0 0 1-2-2V17.01a2 2 0 0 1 2-2h5.799S17 6 24 6Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M32 15a11.91 11.91 0 0 1 1.684 1.859A12.07 12.07 0 0 1 36 24c0 2.654-.846 5.107-2.278 7.09A11.936 11.936 0 0 1 32 33" />
            <path stroke-linecap="round" d="M34.236 41.186C40.084 37.696 44 31.305 44 24c0-7.192-3.796-13.496-9.493-17.02" />
          </g>
        </mask>
      </defs>
      <path fill="currentColor" d="M0 0h48v48H0z" mask="url(#volumeMask)" />
    </svg>
    <svg class="icon icon-pause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="6" y="5" width="4" height="14" rx="1.4" fill="currentColor" />
      <rect x="14" y="5" width="4" height="14" rx="1.4" fill="currentColor" />
    </svg>
    <audio id="song" src="assets/KAMIKAZE.mp3" loop preload="auto"></audio>
  </button>

  <!-- profile -->
  <main class="profile">
    <div class="tilt-box" id="tiltBox">
      <div class="card">
        <div class="avatar-wrap reveal" data-delay="0">
          <img class="avatar" src="assets/pfp.png" alt="zen avatar" />
        </div>

        <div class="info">
          <div class="name-row reveal" data-delay="1">
            <h1 class="name">zen</h1>
            <div class="badges" aria-label="Badges">
              <span class="badge" title="Premium">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="23 32 465 448" aria-hidden="true">
                  <path fill="currentColor" d="M396.31 32H264l84.19 112.26L396.31 32zm-280.62 0l48.12 112.26L248 32H115.69zM256 74.67L192 160h128l-64-85.33zm166.95-23.61L376.26 160H488L422.95 51.06zm-333.9 0L23 160h112.74L89.05 51.06zM146.68 192H24l222.8 288h.53L146.68 192zm218.64 0L264.67 480h.53L488 192H365.32zm-35.93 0H182.61L256 400l73.39-208z" />
                </svg>
              </span>
            </div>
          </div>

          <p class="bio reveal" data-delay="2">yooo wsp</p>
        </div>
      </div>
    </div>
  </main>

  <!-- footer stats -->
  <footer class="meta reveal" data-delay="3">
    <span class="stat views">
      <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 9a3 3 0 0 0-3 3a3 3 0 0 0 3 3a3 3 0 0 0 3-3a3 3 0 0 0-3-3m0 8a5 5 0 0 1-5-5a5 5 0 0 1 5-5a5 5 0 0 1 5 5a5 5 0 0 1-5 5m0-12.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5" />
      </svg>
      <span class="count" id="views" aria-label="Profile views">1,042</span>
    </span>
    <span class="sep" aria-hidden="true">|</span>
    <span class="stat location">
      <svg class="icon-pin" xmlns="http://www.w3.org/2000/svg" viewBox="4 2 16 20" aria-hidden="true">
        <path fill="currentColor" d="M12 12q.825 0 1.413-.587T14 10t-.587-1.412T12 8t-1.412.588T10 10t.588 1.413T12 12m0 10q-4.025-3.425-6.012-6.362T4 10.2q0-3.75 2.413-5.975T12 2t5.588 2.225T20 10.2q0 2.5-1.987 5.438T12 22" />
      </svg>
      <span>Tokyo, japan</span>
    </span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
