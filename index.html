```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: white;
      color: black;
    }

    #hi {
      font-size: 48px;
    }

    #device {
      position: fixed;
      bottom: 20px;
      font-size: 14px;
      color: #888;
    }

    /* Mobile */
    @media (max-width: 600px) {
      #hi {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <div id="hi">Hi /oft</div>
  <div id="device"></div>

  <script>
    const isMobile = window.matchMedia("(max-width: 600px)").matches;

    document.getElementById("device").textContent =
      isMobile ? "You are on mobile" : "You are on PC";
  </script>

</body>
</html>
```
