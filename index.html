<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@zen</title>
  <meta name="description" content="just a dude!" />
  <link rel="icon" href="assets/avatar.webp" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- background -->
  <div class="bg-image" aria-hidden="true"></div>
  <div class="bg-shade" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- preloader -->
  <div class="loader" id="loader" aria-hidden="true">
    <span class="caret"></span>
  </div>

  <!-- audio toggle -->
  <button class="audio-btn" id="audioBtn" type="button" aria-label="Play profile song" aria-pressed="false">
    <svg class="icon icon-volume" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <mask id="volumeMask">
          <g fill="none" stroke="#fff" stroke-width="4">
            <path fill="#555" stroke-linejoin="round" d="M24 6v36c-7 0-12.201-9.16-12.201-9.16H6a2 2 0 0 1-2-2V17.01a2 2 0 0 1 2-2h5.799S17 6 24 6Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M32 15a11.91 11.91 0 0 1 1.684 1.859A12.07 12.07 0 0 1 36 24c0 2.654-.846 5.107-2.278 7.09A11.936 11.936 0 0 1 32 33" />
            <path stroke-linecap="round" d="M34.236 41.186C40.084 37.696 44 31.305 44 24c0-7.192-3.796-13.496-9.493-17.02" />
          </g>
        </mask>
      </defs>
      <path fill="currentColor" d="M0 0h48v48H0z" mask="url(#volumeMask)" />
    </svg>
    <svg class="icon icon-pause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="6" y="5" width="4" height="14" rx="1.4" fill="currentColor" />
      <rect x="14" y="5" width="4" height="14" rx="1.4" fill="currentColor" />
    </svg>
    <audio id="song" src="assets/song.mp3" loop preload="metadata"></audio>
  </button>

  <!-- profile -->
  <main class="profile">
    <div class="card">
      <div class="avatar-wrap reveal" data-delay="0">
        <img class="avatar" src="assets/avatar.webp" alt="zen avatar" />
      </div>

      <div class="info">
        <div class="name-row reveal" data-delay="1">
          <h1 class="name">zen</h1>
          <div class="badges" aria-label="Badges">
            <span class="badge" title="Premium">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="23 32 465 448" aria-hidden="true">
                <path fill="currentColor" d="M396.31 32H264l84.19 112.26L396.31 32zm-280.62 0l48.12 112.26L248 32H115.69zM256 74.67L192 160h128l-64-85.33zm166.95-23.61L376.26 160H488L422.95 51.06zm-333.9 0L23 160h112.74L89.05 51.06zM146.68 192H24l222.8 288h.53L146.68 192zm218.64 0L264.67 480h.53L488 192H365.32zm-35.93 0H182.61L256 400l73.39-208z" />
              </svg>
            </span>
            <span class="badge" title="The Million">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="2.01 1 20.99 21" aria-hidden="true">
                <path d="M23 7a8.44 8.44 0 0 0-5 1.31c-.36-.41-.73-.82-1.12-1.21l-.29-.27l.14-.12a3.15 3.15 0 0 0 .9-3.49A3.9 3.9 0 0 0 14 1v2a2 2 0 0 1 1.76 1c.17.4 0 .84-.47 1.31l-.23.21a16.71 16.71 0 0 0-3.41-2.2c-2.53-1.14-3.83-.61-4.47 0a2.18 2.18 0 0 0-.46.68l-.18.53L5.1 8.87C6.24 11.71 9 16.76 15 18.94l5-1.66a1 1 0 0 0 .43-.31l.21-.18c1.43-1.44.51-4.21-1.41-6.9A6.63 6.63 0 0 1 23 9zm-3.79 8.37h-.06c-.69.37-3.55-.57-6.79-3.81c-.34-.34-.66-.67-.95-1c-.1-.11-.19-.23-.29-.35l-.53-.64l-.28-.39c-.14-.19-.28-.38-.4-.56s-.16-.26-.24-.39s-.22-.34-.31-.51s-.13-.24-.19-.37s-.17-.28-.23-.42s-.09-.23-.14-.34s-.11-.27-.15-.4S8.6 6 8.58 5.9s-.06-.24-.08-.34a2 2 0 0 1 0-.24a1.15 1.15 0 0 1 0-.26l.11-.31c.17-.18.91-.23 2.23.37a13.83 13.83 0 0 1 2.49 1.54A4.17 4.17 0 0 1 12 7v2a6.43 6.43 0 0 0 3-.94l.49.46c.44.43.83.86 1.19 1.27A5.31 5.31 0 0 0 16 13.2l2-.39a3.23 3.23 0 0 1 0-1.14c1.29 1.97 1.53 3.39 1.21 3.7z" fill="currentColor" />
                <path d="M4.4 11l-2.23 6.7A3.28 3.28 0 0 0 5.28 22a3.21 3.21 0 0 0 1-.17l6.52-2.17A18.7 18.7 0 0 1 4.4 11z" fill="currentColor" />
              </svg>
            </span>
            <span class="badge" title="Hone.gg">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="2 3 20 17.35" aria-hidden="true">
                <path fill="currentColor" d="M12 16a3 3 0 0 1-3-3c0-1.12.61-2.1 1.5-2.61l9.71-5.62l-5.53 9.58c-.5.98-1.51 1.65-2.68 1.65m0-13c1.81 0 3.5.5 4.97 1.32l-2.1 1.21C14 5.19 13 5 12 5a8 8 0 0 0-8 8c0 2.21.89 4.21 2.34 5.65h.01c.39.39.39 1.02 0 1.41s-1.03.39-1.42.01A9.97 9.97 0 0 1 2 13A10 10 0 0 1 12 3m10 10c0 2.76-1.12 5.26-2.93 7.07c-.39.38-1.02.38-1.41-.01a.996.996 0 0 1 0-1.41A7.95 7.95 0 0 0 20 13c0-1-.19-2-.54-2.9L20.67 8C21.5 9.5 22 11.18 22 13" />
              </svg>
            </span>
          </div>
        </div>

        <p class="bio reveal" data-delay="2">just a dude!</p>
      </div>
    </div>
  </main>

  <!-- footer stats -->
  <footer class="meta reveal" data-delay="3">
    <span class="stat views">
      <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 9a3 3 0 0 0-3 3a3 3 0 0 0 3 3a3 3 0 0 0 3-3a3 3 0 0 0-3-3m0 8a5 5 0 0 1-5-5a5 5 0 0 1 5-5a5 5 0 0 1 5 5a5 5 0 0 1-5 5m0-12.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5" />
      </svg>
      <span class="count" id="views" aria-label="Profile views">1,042</span>
    </span>
    <span class="sep" aria-hidden="true">|</span>
    <span class="stat location">
      <svg class="icon-pin" xmlns="http://www.w3.org/2000/svg" viewBox="4 2 16 20" aria-hidden="true">
        <path fill="currentColor" d="M12 12q.825 0 1.413-.587T14 10t-.587-1.412T12 8t-1.412.588T10 10t.588 1.413T12 12m0 10q-4.025-3.425-6.012-6.362T4 10.2q0-3.75 2.413-5.975T12 2t5.588 2.225T20 10.2q0 2.5-1.987 5.438T12 22" />
      </svg>
      <span>idek anymore...</span>
    </span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
